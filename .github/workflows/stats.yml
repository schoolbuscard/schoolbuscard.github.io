name: stats
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stats page
        env:
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
          STATS_OUT: s-p8uv6n1wheje/index.html
        run: python3 scripts/stats.py
      - name: Commit
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add s-p8uv6n1wheje/index.html
          git diff --cached --quiet || (git commit -m "Update stats" && git push)
