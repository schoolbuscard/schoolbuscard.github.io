<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Card maker stats</title>
<style>body{margin:0;background:#faf9f7;color:#231f20;font:17px/1.4 -apple-system,system-ui,sans-serif}main{max-width:560px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin:28px 0 8px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.b{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px}.n{font-size:40px;font-weight:800;line-height:1.1}.l{opacity:.7;font-size:14px}.r{display:flex;justify-content:space-between;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 14px;margin-bottom:8px}.m{opacity:.6}small{opacity:.6}</style></head><body><main>
<h1>Bus/Van card maker</h1><small>Visits and downloads are live. Devices and browsers update about every 30 min (last Oct 6, 12:46 PM ET). Counts start Oct 6 at 11:25 AM.</small>
<h2>Visits</h2><div class="g"><div class="b"><div class="n" id="v-total">2</div><div class="l">Total visits</div></div><div class="b"><div class="n" id="v-week">2</div><div class="l">This week</div></div><div class="b"><div class="n" id="v-today">2</div><div class="l">Today</div></div><div class="b"><div class="n" id="v-req">0</div><div class="l">Color requests</div></div></div>
<h2>Downloads</h2><div class="g"><div class="b"><div class="n" id="v-img">0</div><div class="l">Image</div></div><div class="b"><div class="n" id="v-pdf">0</div><div class="l">PDF</div></div></div>
<h2>Devices</h2><div class="r"><span>iPhone / iPad</span><b>2</b></div>
<h2>Browsers</h2><div class="r"><span>Safari</span><b>2</b></div>
</main>
<script>
(function(){
var C="https://schoolbuscard.goatcounter.com/counter/",BT=11,BE={"download-pdf": 1, "download-image": 1},BD="2026-10-06";
function d(n){var x=new Date(Date.now()+n*864e5);return x.toLocaleDateString("en-CA",{timeZone:"America/New_York"});}
function g(p,s){return fetch(C+p+".json?start="+s+"&end="+d(2)).then(function(r){return r.json()}).then(function(j){return parseInt(String(j.count).replace(/[^0-9]/g,""),10)||0});}
function set(id,n){var e=document.getElementById(id);if(e)e.textContent=Math.max(0,n);}
var td=d(0),wk=d(-7);
g("TOTAL",BD).then(function(n){set("v-total",n-BT)});
g("TOTAL",wk<BD?BD:wk).then(function(n){set("v-week",n-BT)});
g("TOTAL",td).then(function(n){set("v-today",td==BD?n-BT:n)});
[["download-image","v-img"],["download-pdf","v-pdf"],["color-request","v-req"]].forEach(function(a){g(encodeURIComponent(a[0]),BD).then(function(n){set(a[1],n-(BE[a[0]]||0))});});
})();
</script></body></html>
